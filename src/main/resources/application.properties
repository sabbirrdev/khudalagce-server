# SMTP email delivery configuration for production OTP and notification flows
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:your-email@example.com}
spring.mail.password=${SMTP_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

################################################################################
## SMS GATEWAY CONFIGURATION FOR OTP
## Set sms.gateway.enabled=false for testing (OTP stored in DB and visible in response/logs).
## Set sms.gateway.enabled=true in production to send real SMS to mobile phones.
sms.gateway.enabled=${SMS_GATEWAY_ENABLED:false}
sms.gateway.url=${SMS_GATEWAY_URL:https://api.sms-gateway.com/v1/send}
sms.gateway.api-key=${SMS_GATEWAY_API_KEY:}
sms.gateway.sender-id=${SMS_GATEWAY_SENDER_ID:EFood}

################################################################################
## LOYALTY / REWARD POINTS CONFIGURATION
loyalty.points-per-hundred-spend=${LOYALTY_POINTS_PER_HUNDRED_SPEND:1}
loyalty.currency-per-point=${LOYALTY_CURRENCY_PER_POINT:1.0}
loyalty.min-points-to-redeem=${LOYALTY_MIN_POINTS_TO_REDEEM:10}
loyalty.max-discount-percentage=${LOYALTY_MAX_DISCOUNT_PERCENTAGE:50}
loyalty.expiry-days=${LOYALTY_EXPIRY_DAYS:365}

################################################################################
## REFERRAL PROGRAM CONFIGURATION
