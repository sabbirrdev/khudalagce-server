# Active Profile: Defaults to 'local', can be overridden with SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/Khuda-Lagce}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:2003}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

app.jwt-secret=${APP_JWT_SECRET:3fca397df901b8cd7a486b62c4d43b14d397318a8bfce625718712fc48b71cd3}
app-jwt-expiration-milliseconds=${APP_JWT_EXPIRATION:7200000}


################################################################################
# Resources DIR
resources.dir = /resources/KhudaLagce/
#resources.dir = src/main/resources/
################################################################################


################################################################################
## resources Upload and Download filter
image.upload.dir = ${resources.dir}images/
